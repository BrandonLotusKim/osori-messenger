# 2026-09-17: 이 PC의 JVM 기본 file.encoding 이 MS949(한글 레거시 코드페이지)라서,
# UTF-8 로 인코딩 지정 없이 Kotlin/Java 소스를 컴파일하면 한글 문자열 리터럴이 깨진 채로
# .class 파일에 구워지는 문제를 실제로 겪었다(TalkRoomRepository.computeAutoRoomName 의
# "나와의 대화" 리터럴이 컴파일 시점에 손상됨 — 유닛 테스트로 발견). 빌드/테스트/실행(run)
# 전부 이 옵션 없이 돌아가면 같은 문제가 재발할 수 있어 Gradle 데몬 JVM 자체에 강제한다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
# Kotlin 컴파일은 별도의 "Kotlin compiler daemon" 프로세스에서 돌고 이 프로세스는
# org.gradle.jvmargs 를 물려받지 않는다(실측: 위 옵션만으로는 안 고쳐졌고 이 옵션을 추가하니
# 고쳐짐) — 그래서 따로 지정해야 한다.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
